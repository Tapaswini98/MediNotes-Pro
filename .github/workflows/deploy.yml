name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: consultation-app
  LAMBDA_FUNCTION_NAME: consultation-app

jobs:
  deploy:
    # Pipeline paused: repo is public and we're done actively deploying for
    # now. Flip this back to `true` (or remove the line) to resume. This
    # keeps the workflow intact and re-enableable without touching AWS or
    # re-entering secrets.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for AssumeRoleWithWebIdentity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No long-lived AWS keys: the runner presents a short-lived signed
      # OIDC token (expires in ~1hr) whose claims (repo + branch) AWS checks
      # against the role's trust policy before issuing temporary credentials.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::810957418133:role/github-actions-deploy-saas
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --push \
            .

      - name: Deploy new image to Lambda
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # --output none / --query suppress the function's full config in the
          # response (which includes its runtime Environment.Variables in
          # plaintext) from ever reaching the log, since this repo is public.
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --region "$AWS_REGION" \
            --query 'LastUpdateStatus' \
            --output text

          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region "$AWS_REGION"

      - name: Smoke test
        run: |
          URL=$(aws lambda get-function-url-config \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query 'FunctionUrl' --output text)
          curl -sf --max-time 40 "${URL}health" || (echo "Health check failed" && exit 1)
